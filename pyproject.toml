[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnirush"
version = "0.1.0"
description = "An extensible AI orchestration engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "OmniRush contributors" },
]
dependencies = ["requests>=2.31", "pydantic>=2.0"]

[project.scripts]
aksh = "app:run"

[tool.setuptools.packages.find]
include = ["core*", "ui*", "ai*", "tax_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
